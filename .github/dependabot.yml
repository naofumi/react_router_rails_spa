version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    groups:
      bundler-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # No npm ecosystem: this repository has no package.json. The React app is
  # generated into the host Rails app by the install generator.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
